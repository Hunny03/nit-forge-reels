name: Daily Reels

on:
  schedule:
    - cron: '30 0 * * *'    # 06:00 AM IST
    - cron: '30 5 * * *'    # 11:00 AM IST
    - cron: '30 10 * * *'   # 04:00 PM IST
    - cron: '30 15 * * *'   # 09:00 PM IST
    - cron: '30 18 * * *'   # 12:00 AM IST
  workflow_dispatch:
    inputs:
      reel_count:
        description: 'Number of reels to generate in this run'
        required: false
        default: '25'

permissions:
  contents: write

concurrency:
  group: daily-reels
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: System packages (ffmpeg, LaTeX, cairo, pango)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev pkg-config python3-dev \
            texlive texlive-latex-extra texlive-fonts-recommended texlive-science \
            dvisvgm fonts-dejavu-core

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Generate reels batch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          REEL_COUNT: ${{ github.event.inputs.reel_count || '25' }}
        run: python generate_reel.py

      - name: Commit and push
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Reels batch $(date -u +'%F %H:%M UTC')"
            git push origin HEAD:main
          fi
