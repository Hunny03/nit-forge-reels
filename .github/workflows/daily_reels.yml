name: Daily Reels

on:
  schedule:
    - cron: '30 18 * * *'   # 18:30 UTC = 12:00 AM IST
  workflow_dispatch:         # manual run button

permissions:
  contents: write

concurrency:
  group: daily-reels
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: System packages (ffmpeg, LaTeX, cairo, pango)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev pkg-config python3-dev \
            texlive texlive-latex-extra texlive-fonts-recommended texlive-science \
            dvisvgm fonts-dejavu-core

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Generate today's reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python generate_reel.py

      # One squashed commit each day keeps the repo small: old videos do not
      # pile up in git history, only the latest 40 videos exist.
      - name: Commit and push
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git checkout --orphan clean-main
          git add -A
          git commit -m "Daily reel $(date -u +%F)"
          git push -f origin clean-main:main
